<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Everyday Goods | Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="py-4 border-bottom">
      <div class="container d-flex justify-content-between align-items-center">
        <a class="h3 text-decoration-none brand" href="#">everyday<span>goods</span>
        </a>
        <span class="text-secondary">Thoughtful essentials</span>
      </div>
    </header>
    <main class="container py-5">
      <div class="mb-4">
        <h1 class="fw-bold">Shop the collection</h1>
        <p class="text-secondary">Well-designed objects for everyday living.</p>
      </div>
      <div class="row g-4">
        <div class="col-12 col-sm-6 col-md-3">
          <article class="card product-card h-100">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80" class="card-img-top" alt="Minimal wristwatch">
            <div class="card-body">
              <h2 class="h5">Classic Watch</h2>
              <p class="price">₹2,499</p>
              <button class="btn btn-dark w-100">Add to Cart</button>
            </div>
          </article>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <article class="card product-card h-100">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80" class="card-img-top" alt="Wireless headphones">
            <div class="card-body">
              <h2 class="h5">Studio Headphones</h2>
              <p class="price">₹3,299</p>
              <button class="btn btn-dark w-100">Add to Cart</button>
            </div>
          </article>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <article class="card product-card h-100">
            <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=600&q=80" class="card-img-top" alt="Compact camera">
            <div class="card-body">
              <h2 class="h5">Pocket Camera</h2>
              <p class="price">₹5,499</p>
              <button class="btn btn-dark w-100">Add to Cart</button>
            </div>
          </article>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <article class="card product-card h-100">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80" class="card-img-top" alt="Red running sneaker">
            <div class="card-body">
              <h2 class="h5">Daily Sneakers</h2>
              <p class="price">₹2,899</p>
              <button class="btn btn-dark w-100">Add to Cart</button>
            </div>
          </article>
        </div>
      </div>
    </main>
    <footer class="text-center py-4 border-top">Free shipping on orders over ₹999</footer>
  </body>
</html>
