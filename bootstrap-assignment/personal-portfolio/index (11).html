<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personal Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="bg-light text-dark">
    <header class="container text-center mt-4 mb-3 p-5 rounded-4 portfolio-header">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=320&q=80" class="img-fluid rounded-circle profile-img mb-3" alt="Profile portrait">
      <h1 class="fw-bold">Ananya Sharma</h1>
      <p class="lead">Student • Developer • Curious Creator</p>
      <a href="#contact" class="btn btn-primary me-2">Hire Me</a>
      <a href="#" class="btn btn-outline-primary">Download CV</a>
    </header>
    <main class="container pb-5">
      <div class="row g-4">
        <section class="col-md-6">
          <div class="card h-100">
            <div class="card-body">
              <h2 class="h4">About Me</h2>
              <p>I enjoy building clean, accessible websites and learning how thoughtful technology solves everyday problems.</p>
            </div>
          </div>
        </section>
        <section class="col-md-6" id="contact">
          <div class="card h-100">
            <div class="card-body">
              <h2 class="h4">Contact Me</h2>
              <form>
                <label class="form-label" for="email">Email address</label>
                <input id="email" type="email" class="form-control mb-3" placeholder="you@example.com">
                <label class="form-label" for="message">Message</label>
                <textarea id="message" class="form-control mb-3" rows="3" placeholder="Let's talk about your project">
                </textarea>
                <button class="btn btn-primary" type="button">Send Message</button>
              </form>
            </div>
          </div>
        </section>
      </div>
    </main>
    <footer class="text-center py-3">© 2026 Ananya Sharma</footer>
  </body>
</html>
