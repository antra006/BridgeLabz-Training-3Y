<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <div>
              <p class="text-uppercase small fw-bold text-primary mb-1">My workspace</p>
              <h1 class="fw-bold mb-0">Task tracker</h1>
            </div>
            <span class="badge rounded-pill text-bg-primary fs-6">3 pending</span>
          </header>
          <div class="card border-0 shadow-sm">
            <div class="list-group list-group-flush">
              <div class="list-group-item d-flex justify-content-between align-items-center py-3">
                <div>
                  <h2 class="h6 mb-1">Finish project proposal</h2>
                  <small class="text-secondary">Due today</small>
                </div>
                <span class="badge text-bg-danger">High</span>
              </div>
              <div class="list-group-item d-flex justify-content-between align-items-center py-3">
                <div>
                  <h2 class="h6 mb-1">Review design mockups</h2>
                  <small class="text-secondary">Due tomorrow</small>
                </div>
                <span class="badge text-bg-warning">Medium</span>
              </div>
              <div class="list-group-item d-flex justify-content-between align-items-center py-3">
                <div>
                  <h2 class="h6 mb-1">Organize resource folder</h2>
                  <small class="text-secondary">This week</small>
                </div>
                <span class="badge text-bg-success">Low</span>
              </div>
            </div>
            <div class="card-body bg-light">
              <button class="btn btn-success" type="button">Completed <span class="badge text-bg-light text-success ms-1">4</span>
              </button>
            </div>
          </div>
          <p class="text-secondary small mt-3">Keep priorities clear and move one task forward at a time.</p>
        </div>
      </div>
    </main>
  </body>
</html>
