<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map</title>
</head>
<body>

    <!-- This iframe embeds a Google Map -->
    <h1>My School Location</h1>

    <!-- loading="lazy" loads the map only when it is close to being visible -->
    <iframe
        src="https://www.google.com/maps?q=GLA+University+Mathura&output=embed"
        title="Google Map showing GLA University"
        width="600"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>
