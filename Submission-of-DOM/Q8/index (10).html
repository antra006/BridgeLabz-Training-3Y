<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Dropdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Custom Dropdown</h1>
        <div class="dropdown" id="dropdown">
            <button id="dropdownButton" aria-expanded="false">Select a subject ▼</button>
            <div class="options" id="options" hidden>
                <button class="option">JavaScript</button>
                <button class="option">HTML</button>
                <button class="option">CSS</button>
                <button class="option">Python</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
