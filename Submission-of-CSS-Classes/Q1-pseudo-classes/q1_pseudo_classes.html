<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pseudo-Classes</title>
  <link rel="stylesheet" href="q1_pseudo_classes.css">
</head>
<body>
  <main>
    <h1>Pseudo-Classes Demonstration</h1>
    <div class="examples">
      <section><a href="#">Hover Link</a><p>:hover changes the link when the mouse is over it.</p></section>
      <section><button>Focus Button</button><p>:focus highlights the button when selected.</p></section>
      <section><button class="active-btn">Active Button</button><p>:active changes the button while it is being clicked.</p></section>
      <section><ul><li>First item</li><li>Second item</li><li>Third item</li></ul><p>:nth-child() styles a specific list item.</p></section>
    </div>
  </main>
</body>
</html>
