<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini User Interface</title>
  <link rel="stylesheet" href="q10_mini_ui.css">
</head>
<body>
  <header><h1>My Mini UI</h1></header>
  <main>
    <section class="card">
      <div class="content">
        <h2>Contact Us</h2>
        <p>Fill in the form to send a message.</p>
        <form>
          <input type="text" placeholder="Your Name">
          <input type="email" placeholder="Your Email">
          <textarea placeholder="Your Message"></textarea>
          <div class="buttons"><button type="submit">Send</button><button type="reset">Reset</button></div>
        </form>
      </div>
      <img src="https://picsum.photos/220/180" alt="Small decorative image">
    </section>
  </main>
  <footer>© 2026 Mini UI</footer>
</body>
</html>
