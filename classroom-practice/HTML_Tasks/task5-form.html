<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
            padding: 12px;
        }

        td:first-child {
            width: 25%;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"] {
            width: 250px;
            padding: 8px;
        }

        textarea {
            width: 250px;
            height: 80px;
        }

        select {
            padding: 6px;
            width: 130px;
        }

        .heading {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .buttons {
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Student Registration Form</h1>

    <form>

        <table>

            <tr>
                <td colspan="2" class="heading">
                    Registration Form
                </td>
            </tr>

            <tr>
                <td>Full Name</td>
                <td>
                    <input type="text" placeholder="Enter your name">
                </td>
            </tr>

            <tr>
                <td>Email</td>
                <td>
                    <input type="email" placeholder="abc@gmail.com">
                </td>
            </tr>

            <tr>
                <td>Phone Number</td>
                <td>
                    <input type="tel" placeholder="9876543210">
                </td>
            </tr>

            <tr>
                <td>Date of Birth</td>
                <td>
                    <input type="date">
                </td>
            </tr>

            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                    <input type="radio" name="gender"> Other
                </td>
            </tr>

            <tr>
                <td>Skills</td>
                <td>
                    <input type="checkbox"> HTML
                    <input type="checkbox"> CSS
                    <input type="checkbox"> JavaScript
                </td>
            </tr>

            <tr>
                <td>Course</td>
                <td>
                    <select>
                        <option>--Select Course--</option>
                        <option>HTML</option>
                        <option>CSS</option>
                        <option>JavaScript</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Address</td>
                <td>
                    <textarea></textarea>
                </td>
            </tr>

            <tr>
                <td>Upload Resume</td>
                <td>
                    <input type="file">
                </td>
            </tr>

            <tr>
                <td colspan="2" class="buttons">
                    <input type="submit" value="Register">
                    <input type="reset" value="Reset">
                </td>
            </tr>

        </table>

    </form>

</body>
</html>
