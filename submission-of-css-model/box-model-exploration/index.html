<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS Box Model Explorer</h1>
    </header>

    <main>
        <section class="model">

            <div class="margin-layer">

                <div class="border-layer">

                    <div class="padding-layer">

                        <div class="content-layer">
                            CONTENT
                        </div>

                    </div>

                </div>

            </div>

        </section>

        <section class="description">
            <p><strong>Content:</strong> Actual information inside the element.</p>
            <p><strong>Padding:</strong> Space between content and border.</p>
            <p><strong>Border:</strong> Line surrounding the padding.</p>
            <p><strong>Margin:</strong> Space outside the border.</p>
        </section>

    </main>

</body>
</html>
