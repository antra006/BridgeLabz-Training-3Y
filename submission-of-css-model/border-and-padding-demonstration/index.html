<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border & Padding Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Border & Padding Showcase</h1>
        <p>Different border styles, rounded corners and padding values</p>
    </header>

    <main>
        <section class="box-container">

            <div class="box solid-box">
                <h2>Solid Border</h2>
                <p>Padding: 20px</p>
            </div>

            <div class="box dashed-box">
                <h2>Dashed Border</h2>
                <p>Padding: 30px</p>
            </div>

            <div class="box double-box">
                <h2>Double Border</h2>
                <p>Padding: 15px</p>
            </div>

            <div class="box groove-box">
                <h2>Groove Border</h2>
                <p>Rounded Corners</p>
            </div>

        </section>
    </main>

    <footer>
        <p>CSS Borders & Padding Practice</p>
    </footer>

</body>
</html>
