<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Card Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Shadow Card Gallery</h1>
    </header>

    <main class="card-container">

        <article class="card card-one">
            <h2>Profile One</h2>
            <p>Soft shadow effect.</p>
        </article>

        <article class="card card-two">
            <h2>Profile Two</h2>
            <p>Medium shadow effect.</p>
        </article>

        <article class="card card-three">
            <h2>Profile Three</h2>
            <p>Strong shadow effect.</p>
        </article>

    </main>

</body>
</html>
