<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Size & Dimension Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Height & Width Practice</h1>
    </header>

    <main class="container">

        <section class="box box-one">
            <h2>PX Box</h2>
            <p>Width: 200px<br>Height: 150px</p>
        </section>

        <section class="box box-two">
            <h2>Percentage Box</h2>
            <p>Width: 40%<br>Max Width: 350px</p>
        </section>

        <section class="box box-three">
            <h2>VH & EM Box</h2>
            <p>Height: 25vh<br>Width: 15em</p>
        </section>

    </main>

</body>
</html>
