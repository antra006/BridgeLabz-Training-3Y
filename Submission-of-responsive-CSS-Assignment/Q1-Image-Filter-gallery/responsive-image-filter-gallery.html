<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>

    <header>
        <h1>Image Filter Gallery</h1>
    </header>

    <main class="gallery">
        <figure>
            <img class="blur" src="https://picsum.photos/300/200?random=1" alt="Blur Image">
            <figcaption>Blur</figcaption>
        </figure>

        <figure>
            <img class="grayscale" src="https://picsum.photos/300/200?random=2" alt="Grayscale Image">
            <figcaption>Grayscale</figcaption>
        </figure>

        <figure>
            <img class="sepia" src="https://picsum.photos/300/200?random=3" alt="Sepia Image">
            <figcaption>Sepia</figcaption>
        </figure>

        <figure>
            <img class="brightness" src="https://picsum.photos/300/200?random=4" alt="Brightness Image">
            <figcaption>Brightness</figcaption>
        </figure>

        <figure>
            <img class="contrast" src="https://picsum.photos/300/200?random=5" alt="Contrast Image">
            <figcaption>Contrast</figcaption>
        </figure>

        <figure>
            <img class="hue" src="https://picsum.photos/300/200?random=6" alt="Hue Rotate Image">
            <figcaption>Hue Rotate</figcaption>
        </figure>
    </main>

    <footer>
        <p>Responsive CSS Gallery</p>
    </footer>

</body>
</html>
