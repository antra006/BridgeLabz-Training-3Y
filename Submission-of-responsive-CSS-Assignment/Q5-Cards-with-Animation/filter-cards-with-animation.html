<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards</title>
    <link rel="stylesheet" href="filter-cards-with-animation.css">
</head>
<body>

    <main class="profile-container">

        <div class="profile-card">
            <img src="https://picsum.photos/200?random=11" alt="Alice">
            <h2>Alice</h2>
            <p>Designer</p>
        </div>

        <div class="profile-card">
            <img src="https://picsum.photos/200?random=12" alt="Bob">
            <h2>Bob</h2>
            <p>Developer</p>
        </div>

        <div class="profile-card">
            <img src="https://picsum.photos/200?random=13" alt="Charlie">
            <h2>Charlie</h2>
            <p>Data Analyst</p>
        </div>

    </main>

</body>
</html>
