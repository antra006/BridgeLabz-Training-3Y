<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive CSS Cheat Sheet</title>
    <link rel="stylesheet" href="responsive-css-cheat-sheet.css">
</head>
<body>

    <h1>Responsive CSS Cheat Sheet</h1>

    <main class="cheat-sheet">

        <div class="topic">
            <h2>Filters</h2>
            <p>filter: grayscale(100%);</p>
        </div>

        <div class="topic">
            <h2>Media Queries</h2>
            <p>@media (max-width: 700px)</p>
        </div>

        <div class="topic">
            <h2>Responsive Design</h2>
            <p>Use flexible layouts for different screens.</p>
        </div>

        <div class="topic">
            <h2>Typography</h2>
            <p>Use clamp() for responsive font sizes.</p>
        </div>

    </main>

</body>
</html>
