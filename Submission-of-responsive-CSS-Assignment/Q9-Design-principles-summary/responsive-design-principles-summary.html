<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Design Principles</title>
    <link rel="stylesheet" href="responsive-design-principles-summary.css">
</head>
<body>

    <h1>Responsive Design Principles</h1>

    <main class="principles">

        <div class="principle">
            <h2>Fluid Layouts</h2>
            <p>Use flexible widths for different screen sizes.</p>
            <code>width: 100%;</code>
        </div>

        <div class="principle">
            <h2>Flexible Media</h2>
            <p>Images should fit inside their containers.</p>
            <code>max-width: 100%;</code>
        </div>

        <div class="principle">
            <h2>Breakpoints</h2>
            <p>Change the layout at different screen sizes.</p>
            <code>@media (max-width: 600px)</code>
        </div>

    </main>

</body>
</html>
