<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>

    <main class="comparison">

        <figure>
            <img src="https://picsum.photos/400/250?random=21" alt="Before Image">
            <figcaption>Before</figcaption>
        </figure>

        <figure>
            <img class="filtered" src="https://picsum.photos/400/250?random=21" alt="After Image">
            <figcaption>After</figcaption>
        </figure>

    </main>

</body>
</html>
