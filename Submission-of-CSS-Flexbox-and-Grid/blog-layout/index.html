<!DOCTYPE html>
<html>
<head>
    <title>Blog Layout</title>
    <link rel="stylesheet" href="blog-layout.css">
</head>
<body>

<div class="container">

    <div class="header">
        <h2>My Blog</h2>
        <p>Home | About | Contact</p>
    </div>

    <div class="sidebar">
        <h3>Categories</h3>
        <p>Technology</p>
        <p>Education</p>
        <p>Travel</p>
    </div>

    <div class="main">

        <div class="box1">
            <h2>Blog Post 1</h2>
            <p>This is the first blog post.</p>
        </div>

        <div class="box2">
            <h2>Blog Post 2</h2>
            <p>This is the second blog post.</p>
        </div>

    </div>

    <div class="footer">
        <p>Email: example@gmail.com</p>
    </div>

</div>

</body>
</html>
